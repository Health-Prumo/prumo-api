name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tipos (mypy)
        run: mypy

      - name: Segurança (bandit)
        run: bandit -q -r src -c pyproject.toml

      - name: Testes (pytest)
        run: pytest

      - name: Pacote da Lambda
        run: scripts/build.sh

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CLI direto: a gitleaks-action exige licença paga em repositórios de organização.
      - name: Gitleaks
        env:
          VERSAO: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
