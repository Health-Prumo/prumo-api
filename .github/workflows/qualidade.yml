name: Qualidade

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/development.txt
      - run: python scripts/dev.py check
      - run: python scripts/dev.py test
      - run: python scripts/dev.py event
      - run: python scripts/dev.py audit
  container-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 90
      - run: curl --fail http://127.0.0.1:8000/health
      - if: always()
        run: docker compose down
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - run: gitleaks git --redact --no-banner
