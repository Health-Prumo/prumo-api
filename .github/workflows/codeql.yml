name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  analisar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4
